<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To-Do App</title>
<style>
body{font-family: sans-serif; background:#f5f5f5; display:flex; justify-content:center; padding-top:50px}
.box{background:white; padding:20px; border-radius:12px; width:90%; max-width:400px; box-shadow:0 4px 10px rgba(0,0,0,0.1)}
h2{text-align:center}
input{width:70%; padding:10px; border:1px solid #ddd; border-radius:8px}
button{padding:10px 15px; border:none; background:black; color:white; border-radius:8px; margin-left:5px}
li{list-style:none; padding:10px; background:#fafafa; margin-top:8px; border-radius:6px; display:flex; justify-content:space-between}
</style>
</head>
<body>
<div class="box">
<h2>My To-Do List</h2>
<div>
<input id="task" placeholder="Search here">
<button onclick="add()">Add</button>
</div>
<ul id="list"></ul>
</div>
<script>
function add(){
let t=document.getElementById('task').value;
if(t=="") return;
let li=document.createElement('li');
li.innerHTML=t + " <span onclick='this.parentElement.remove()' style='color:red;cursor:pointer'>X</span>";
document.getElementById('list').appendChild(li);
document.getElementById('task').value="";
}
</script>
</body>
</html>
